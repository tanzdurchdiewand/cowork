<html>

<head>
    <script type="module">
        import { store } from "/components/welcome/welcome-store.js";
    </script>
</head>

<body>
    <div x-data >
        <template x-if="$store.welcomeStore && $store.welcomeStore.isVisible">
            <div x-create="$store.welcomeStore.onCreate()" class="welcome-container">
                <div class="welcome-content">
                    <!-- Logo -->
                    <div class="welcome-logo-container">
                        <img src="./public/favicon.svg" alt="Coworker" class="welcome-logo">
                    </div>

                    <!-- Greeting -->
                    <h1 class="welcome-title">What can I help with?</h1>

                    <!-- Input -->
                    <div class="welcome-input-wrapper">
                        <textarea
                            class="welcome-input"
                            placeholder="Ask me anything..."
                            rows="1"
                            @keydown.enter.prevent="$store.welcomeStore.submitFromWelcome($event.target.value); $event.target.value = ''; $event.target.style.height = 'auto'"
                            @input="$event.target.style.height = 'auto'; $event.target.style.height = Math.min($event.target.scrollHeight, 128) + 'px'"
                        ></textarea>
                        <button class="welcome-send-btn"
                            @click="const ta = $el.parentElement.querySelector('textarea'); $store.welcomeStore.submitFromWelcome(ta.value); ta.value = ''; ta.style.height = 'auto'">
                            <span class="material-symbols-outlined">arrow_upward</span>
                        </button>
                    </div>

                    <!-- Banner Section -->
                    <div class="welcome-banners" x-show="$store.welcomeStore.banners && $store.welcomeStore.banners.length > 0">
                        <template x-for="banner in $store.welcomeStore.sortedBanners" :key="banner.id">
                            <div class="welcome-banner" :class="$store.welcomeStore.getBannerClass(banner.type)">
                                <div class="welcome-banner-icon">
                                    <span class="material-symbols-outlined" x-text="$store.welcomeStore.getBannerIcon(banner.type)"></span>
                                </div>
                                <div class="welcome-banner-content">
                                    <div class="welcome-banner-title" x-text="banner.title"></div>
                                    <div class="welcome-banner-html" x-html="banner.html"></div>
                                </div>
                                <button class="welcome-banner-dismiss"
                                        x-show="banner.dismissible !== false"
                                        @click.stop="$store.welcomeStore.dismissBanner(banner.id)"
                                        title="Dismiss">
                                    <span class="material-symbols-outlined">close</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <style>
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3%;
            text-align: center;
            background: var(--color-background);
            color: var(--color-text);
            min-height: 100vh;
            position: relative;
        }

        .welcome-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-logo {
            width: 4rem;
            height: 4rem;
        }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 400;
            margin: 1rem 0 1.5rem 0;
            color: var(--color-text);
            opacity: 0.85;
        }

        /* Input area */
        .welcome-input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            width: 100%;
            max-width: 600px;
            background: var(--color-message-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            padding: 0.75rem 0.75rem 0.75rem 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .welcome-input-wrapper:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 12%, transparent);
        }

        .welcome-input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--color-text);
            font-family: var(--font-family-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
            max-height: 8rem;
            overflow-y: auto;
        }

        .welcome-input::placeholder {
            color: var(--color-text-muted);
            opacity: 0.6;
        }

        .welcome-send-btn {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            border: none;
            background: var(--color-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .welcome-send-btn:hover {
            filter: brightness(0.9);
        }

        .welcome-send-btn:active {
            transform: scale(0.92);
        }

        .welcome-send-btn .material-symbols-outlined {
            font-size: 1.2rem;
        }

        /* Banner Styles */
        .welcome-banners {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 600px;
            width: 100%;
            margin-top: 2rem;
        }

        .welcome-banner {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            text-align: left;
            position: relative;
            transition: all 0.2s ease;
        }

        .welcome-banner.banner-info {
            border-left: 4px solid #2196F3;
        }

        .welcome-banner.banner-warning {
            border-left: 4px solid #FF9800;
        }

        .welcome-banner.banner-error {
            border-left: 4px solid #F44336;
        }

        .welcome-banner-icon {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-top: 2px;
        }

        .welcome-banner-icon .material-symbols-outlined {
            font-size: 1.25rem;
        }

        .banner-info .welcome-banner-icon { color: #2196F3; }
        .banner-warning .welcome-banner-icon { color: #FF9800; }
        .banner-error .welcome-banner-icon { color: #F44336; }

        .welcome-banner-content {
            flex: 1;
            min-width: 0;
        }

        .welcome-banner-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--color-text);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .welcome-banner-html {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            line-height: 1.5;
        }

        .welcome-banner-html a {
            color: var(--color-primary);
            text-decoration: underline;
        }

        .welcome-banner-html strong {
            color: var(--color-text);
            font-weight: 600;
        }

        .welcome-banner-dismiss {
            flex-shrink: 0;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            opacity: 0.6;
        }

        .welcome-banner-dismiss:hover {
            background: var(--color-border);
            color: var(--color-text);
            opacity: 1;
        }

        .welcome-banner-dismiss .material-symbols-outlined {
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-container {
                padding: 1rem;
                padding-top: 3rem;
            }

            .welcome-logo {
                width: 3rem;
                height: 3rem;
            }

            .welcome-title {
                font-size: 1.3rem;
            }

            .welcome-input-wrapper {
                max-width: 100%;
            }

            .welcome-banners {
                max-width: 100%;
            }
        }
    </style>
</body>

</html>
