<html>
<head>
  <script type="module">
    import { store } from "/components/chat/input/input-store.js";
    import { store as chatsStore } from "/components/sidebar/chats/chats-store.js";
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.chatInput">
      <div class="text-buttons-row">
        <button class="text-button" @click="$store.chatInput.pauseAgent(!$store.chatInput.paused)">
            <template x-if="!$store.chatInput.paused">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="14" height="14">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path>
                </svg>
            </template>
            <template x-if="$store.chatInput.paused">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="14" height="14">
                    <path d="M8 5v14l11-7z"></path>
                </svg>
            </template>
            <span x-text="$store.chatInput.paused ? 'Resume Agent' : 'Pause Agent'"></span>
        </button>

        <button class="text-button" @click="$store.chats.saveChat()" :disabled="!$store.chats.selected">
            <span class="material-symbols-outlined">save</span>
            <p>Save Chat</p>
        </button>

        <button class="text-button" @click="$store.chatInput.loadKnowledge()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"></path>
            </svg>
            <p>Import knowledge</p>
        </button>

        <button class="text-button" id="work_dir_browser" @click="$store.chatInput.browseFiles()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 123.37 92.59">
                <path d="m5.72,11.5l-3.93,8.73h119.77s-3.96-8.73-3.96-8.73h-60.03c-1.59,0-2.88-1.29-2.88-2.88V1.75H13.72v6.87c0,1.59-1.29,2.88-2.88,2.88h-5.12Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="7"></path>
                <path d="m6.38,20.23H1.75l7.03,67.03c.11,1.07.55,2.02,1.2,2.69.55.55,1.28.89,2.11.89h97.1c.82,0,1.51-.33,2.05-.87.68-.68,1.13-1.67,1.28-2.79l9.1-66.94H6.38Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="8"></path>
            </svg>
            <p>Files</p>
        </button>
      </div>
    </template>
  </div>

  <style>
        .text-buttons-row { width: 100%; display: flex; padding-top: var(--spacing-xs); margin-left: var(--spacing-xs); }
        .text-button { background-color: transparent; border: 1px solid transparent; border-radius: var(--lux-radius-sm); color: var(--color-text); font-family: var(--font-family-main); font-size: 0.65rem; padding: 6px var(--spacing-sm); cursor: pointer; opacity: 0.7; -webkit-transition: all 0.2s ease; transition: all 0.2s ease; display: flex; align-items: center; gap: var(--spacing-xs); }
        .text-button:hover:not(:disabled) { opacity: 1; background-color: var(--color-background-hover); border-color: var(--color-border); }
        .text-button:hover:not(:disabled) svg, .text-button:hover:not(:disabled) .material-symbols-outlined { color: var(--color-accent); transform: scale(1.1); }
        .text-button:active:not(:disabled) { opacity: 0.6; transform: scale(0.95); }
        .text-button:disabled { opacity: 0.4; cursor: not-allowed; }
        .text-button svg { width: 14px; height: 14px; flex-shrink: 0; transition: all 0.2s ease; }
        .text-button .material-symbols-outlined { font-size: 14px; flex-shrink: 0; transition: all 0.2s ease; }
        .text-button p { margin-block: 0; }
        
        /* NEW DESIGN: Enhanced bottom action buttons */
        .new-design .text-button {
          letter-spacing: 0.03em;
          font-weight: 500;
        }
        .new-design .text-button:hover:not(:disabled) {
          border-color: rgba(237, 166, 163, 0.3);
          box-shadow: 0 0 10px rgba(237, 166, 163, 0.08);
        }
        .new-design.light-mode .text-button:hover:not(:disabled) {
          border-color: rgba(226, 125, 96, 0.3);
          box-shadow: 0 0 10px rgba(226, 125, 96, 0.06);
        }

        @media (max-width: 768px) { .text-buttons-row { width: 90%; display: flex; padding-top: var(--spacing-xs); gap: var(--spacing-xs); white-space: pre-wrap; } .text-button { font-size: 0.6rem; } .text-button svg { width: 18px; height: 18px; flex-shrink: 0; } .text-button .material-symbols-outlined { font-size: 18px; } }
        @media (max-width: 640px) { .text-buttons-row { display: flex; width: 90%; padding-top: var(--spacing-xs); gap: var(--spacing-xs); white-space: pre-wrap; } .text-button { max-height: 25px; } .text-button p { display: none; } }
    </style>
</body>
</html>
